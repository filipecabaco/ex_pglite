[package]
name = "pglite_port"
version = "0.2.0"
edition = "2021"

[lib]
name = "pglite_port"
path = "src/lib.rs"

[[bin]]
name = "pglite_port"
path = "src/main.rs"

[[bin]]
name = "build_artifacts"
path = "src/bin/build_artifacts.rs"

[dependencies]
wasmtime = "40"
wasmtime-wasi = "40"
serde_json = "1.0"
anyhow = "1.0"
zstd = "0.13"
tar = "0.4"
once_cell = "1.19"
tokio = { version = "1.40", features = ["full", "rt-multi-thread", "macros"] }

[dev-dependencies]
